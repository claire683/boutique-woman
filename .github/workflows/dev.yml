# Site de dev : à chaque envoi sur main, récupère les photos, compile et publie sur GitHub Pages.
name: Site de dev
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run images
      - name: Outil de détourage (modèle local, sans service externe)
        run: npm i --no-save @imgly/background-removal-node --onnxruntime-node-install-cuda=skip
      - name: Visuels IA Canva (rapatriés une seule fois puis gardés dans le dépôt)
        run: |
          npm run ia
          if [ -n "$(git status --porcelain public/ia)" ]; then
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git add public/ia && git commit -m "Visuels IA rapatriés depuis Canva [skip ci]" && git push
          fi
      - run: npm run detourer
      - run: npm run build
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          BASE: /${{ github.event.repository.name }}
          PUBLIC_IMAGES_LOCALES: 'true'
          PUBLIC_DEV: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
